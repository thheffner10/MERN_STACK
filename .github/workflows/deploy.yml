name: Deploy MERN Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository code
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.18'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Build frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # Deploy frontend files to server
      - name: Deploy frontend to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend/dist/*"
          target: "/var/www/frontend"
          strip_components: 2
          rm: true

      # Deploy backend files to server
      - name: Deploy backend files
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "backend/**"
          target: "/var/www/backend"
          strip_components: 1
          overwrite: true

      # Install backend dependencies and restart PM2
      - name: Install dependencies and restart server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Navigate to backend directory
            cd /var/www/backend

            # Install production dependencies
            npm ci --production

            # Ensure PM2 is installed globally
            npm list -g pm2 || npm install -g pm2

            # Reload existing application or start it if missing
            pm2 reload habittracker-api --update-env || pm2 start server.js --name "habittracker-api"

            # Save PM2 process list
            pm2 save

            # Reload nginx
            nginx -s reload

